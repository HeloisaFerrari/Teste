<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnQ7p4wTz9c/6U+T1i/Q3N6s5/y1y1Q3y3" crossorigin="anonymous">
  <style>
.minha-card{
    width: 200px;   
    border: 1px solid black;
    margin: auto;
    justify-content: center;
    align-items: center;margin-top: 100px;
}


.minha-card img{
    width: 100%;    
    height: 100px;
    object-fit: cover;
}

.card-body{
    width: 100%;
    margin: 5px;         
}

.card-text{
    word-wrap: break-word; 
}
.card-title{
    margin: 0px;
    font-size: large;
}

  </style>
</head>

<body>
    <div class="card minha-card">
        <img src="assets/girassol.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">Card title</h5>
          <p class="card-text">Os girassos são flores estremamentes lindas aonde encantam qualquer u qua as ve </p>
          <a href="#" class="btn btn-primary">Go somewhere</a>
        </div>
    </div>
</html>
